# Serves the built studio and proxies the API (service "api" in docker-compose).
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 300m;          # several full-resolution photos per upload

  location /api/ {
    proxy_pass http://api:8787;
    proxy_read_timeout 900s;          # reconstruction requests return quickly (jobs), but be generous
    proxy_send_timeout 900s;
    proxy_set_header Host $host;
  }

  location ~* \.(wasm)$ {
    types { application/wasm wasm; }
    add_header Cache-Control "public, max-age=604800";
  }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri /index.html; }
}
