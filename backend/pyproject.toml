[project]
name = "veronica-backend"
version = "0.1.0"
description = "VERONICA — The Spatial Intelligence System: reconstruction & inference backend"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "pillow>=10.3",
  "opencv-python-headless>=4.10",
  "trimesh>=4.4",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.50",
  "accelerate>=0.33",
  "huggingface_hub>=0.25",
  "safetensors>=0.4",
  "scikit-image>=0.24",
  "httpx>=0.27",
  "pillow-heif>=0.18",
]

[project.optional-dependencies]
# Multi-view reconstruction (Depth Anything 3). The `depth-anything-3` wheel itself is
# installed with --no-deps (its declared deps include CUDA-only xformers); see README.
multiview = ["omegaconf>=2.3", "addict>=2.4", "einops>=0.8"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
